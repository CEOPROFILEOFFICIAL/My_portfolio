<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Portfolio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    .admin-wrap { min-height: 100svh; padding: 40px 0 80px; }
    .admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 34px; max-width: 560px; margin: 60px auto; }
    .admin-card h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .admin-card p.sub { color: var(--muted); font-size: .92rem; margin-bottom: 24px; }
    .admin-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; flex-wrap: wrap; gap: 12px; }
    .admin-top h1 { font-size: 1.7rem; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
    .tab { background: var(--surface); border: 1px solid var(--border); color: var(--muted); font: inherit; font-size: .9rem; font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer; transition: all .2s; }
    .tab.active { color: #04120c; background: linear-gradient(100deg, var(--accent), var(--accent-2)); border-color: transparent; }
    .panel { display: none; }
    .panel.active { display: block; }
    .field { display: grid; gap: 7px; margin-bottom: 16px; }
    .field label { font-size: .83rem; font-weight: 600; color: var(--muted); }
    .field input, .field textarea, .field select {
      font: inherit; font-size: .95rem; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; width: 100%;
    }
    .field textarea { min-height: 90px; resize: vertical; }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .item { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; }
    .item-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .item-head strong { font-size: 1rem; }
    .item-meta { color: var(--muted); font-size: .85rem; }
    .item-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-sm { font: inherit; font-size: .83rem; font-weight: 600; padding: 8px 16px; border-radius: 9px; cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text); transition: all .2s; }
    .btn-sm:hover { border-color: var(--accent); }
    .btn-danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn-add { margin-bottom: 20px; }
    .editor { background: var(--bg); border: 1px solid var(--accent); border-radius: 12px; padding: 22px; margin-bottom: 16px; }
    .editor h3 { margin-bottom: 16px; font-size: 1.05rem; }
    .img-preview { max-width: 220px; border-radius: 10px; border: 1px solid var(--border); display: block; margin-top: 10px; }
    .msg-body { color: var(--muted); font-size: .92rem; margin-top: 8px; white-space: pre-wrap; }
    .status { font-size: .9rem; min-height: 1.5em; margin-top: 14px; }
    .status.ok { color: var(--accent); } .status.err { color: var(--danger); }
    .hidden { display: none !important; }
    @media (max-width: 640px) { .field-row { grid-template-columns: 1fr; } .admin-card { margin: 30px auto; padding: 26px; } }
  </style>
</head>
<body>
  <div class="container admin-wrap">

    <!-- Login -->
    <div id="login-view" class="admin-card">
      <h1>Admin Panel<span class="logo-dot">.</span></h1>
      <p class="sub">This area is private. Enter your admin password to manage the website.</p>
      <form id="login-form">
        <div class="field">
          <label for="pw">Password</label>
          <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="login-btn">Log In</button>
        <p class="status" id="login-status" role="status"></p>
      </form>
    </div>

    <!-- Dashboard -->
    <div id="dash-view" class="hidden">
      <div class="admin-top">
        <h1>Dashboard<span class="logo-dot">.</span></h1>
        <div>
          <a href="/" class="btn-sm" style="text-decoration:none; margin-right:8px;">View site</a>
          <button class="btn-sm" id="logout-btn">Log out</button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="settings">Site Settings</button>
        <button class="tab" data-tab="skills">Skills</button>
        <button class="tab" data-tab="projects">Projects</button>
        <button class="tab" data-tab="messages">Messages <span id="msg-count"></span></button>
      </div>

      <section class="panel active" id="panel-settings">
        <div class="item"><div id="settings-form"></div>
          <button class="btn btn-primary" id="save-settings">Save Settings</button>
          <p class="status" id="settings-status" role="status"></p>
        </div>
      </section>

      <section class="panel" id="panel-skills">
        <button class="btn btn-primary btn-add" id="add-skill-btn">+ Add Skill</button>
        <div id="skill-editor"></div>
        <div id="skills-list"></div>
      </section>

      <section class="panel" id="panel-projects">
        <button class="btn btn-primary btn-add" id="add-project-btn">+ Add Project</button>
        <div id="project-editor"></div>
        <div id="projects-list"></div>
      </section>

      <section class="panel" id="panel-messages">
        <div id="messages-list"></div>
      </section>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
